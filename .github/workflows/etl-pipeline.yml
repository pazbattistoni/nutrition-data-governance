name: NutriGovernance ETL Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest 

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Construir imagen Docker
        run: docker build -t nutri-etl:latest .

      - name: Ejecutar ETL en contenedor
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          docker run --rm \
          -e DATABASE_URL="$DATABASE_URL" \
          nutri-etl:latest